<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Madina!</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            color: #4a0e17;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(194, 24, 91, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            max-width: 400px;
            width: 92%;
            z-index: 10;
            position: absolute;
            max-height: 95vh;
            overflow-y: auto;
        }
        .canvas-box {
            position: relative;
            width: 100%;
            height: 130px;
            margin-bottom: 2px;
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
        input {
            padding: 12px;
            width: 85%;
            border-radius: 25px;
            border: 1px solid #f48fb1;
            outline: none;
            text-align: center;
            font-size: 15px;
            margin-bottom: 8px;
            background: #fff;
            color: #333;
        }
        button {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(45deg, #e91e63, #ff4081);
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
            margin-top: 5px;
        }
        button:hover {
            transform: scale(1.05);
        }
        .hidden {
            display: none !important;
        }
        
        /* Automatic Slideshow for Photos (Proper Size, Not Too Small) */
        .slideshow-container {
            position: relative;
            width: 100%;
            height: 220px;
            margin-top: 10px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .slide-img.active {
            opacity: 1;
        }

        h2, h1 {
            color: #c2185b;
            margin-bottom: 6px;
            font-size: 22px;
        }
        p {
            font-size: 13px;
            line-height: 1.3;
            color: #666;
            margin-bottom: 8px;
        }
        .hint-box {
            font-size: 12px;
            color: #ad1457;
            background: rgba(233, 30, 99, 0.08);
            padding: 6px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px dashed rgba(233, 30, 99, 0.3);
        }
    </style>
</head>
<body>

<!-- Password Screen -->
<div class="container" id="login-screen">
    <div class="canvas-box">
        <canvas id="heartCanvas1" width="280" height="130"></canvas>
    </div>
    
    <h2>🔒 Enter Password</h2>
    <p>Surprise kholne ke liye password dein</p>
    
    <div class="hint-box">
        💡 <strong>Hint:</strong> Special date and time
    </div>

    <input type="text" id="pass-input" placeholder="Password likhein...">
    <br>
    <button onclick="checkPassword()">Unlock Surprise</button>
    <p id="error-msg" style="color: #d32f2f; margin-top: 6px; font-size: 12px;"></p>
</div>

<!-- Main Birthday Screen -->
<div class="container hidden" id="main-screen">
    <div class="canvas-box">
        <canvas id="heartCanvas2" width="280" height="130"></canvas>
    </div>

    <h1>🎉 Happy Birthday Madina! 🎂</h1>
    <p>May your life be filled with endless happiness and smiles. You are the best friend ever!</p>
    
    <!-- Automatic Slideshow Photos (Alag alag aur proper size mein aik ke baad doosri aayengi) -->
    <div class="slideshow-container">
        <img src="pic1.jpg" class="slide-img active" alt="Madina Memory 1">
        <img src="pic2.jpg" class="slide-img" alt="Madina Memory 2">
    </div>
    
    <audio id="bg-song" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
    // Particle Heart Animation
    function initHeartCanvas(canvasId) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 220;

        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x * 4.2 + 140, y: y * 4.2 + 65 };
        }

        for (let i = 0; i < particleCount; i++) {
            let t = Math.random() * Math.PI * 2;
            let target = getHeartPoint(t);
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                tx: target.x,
                ty: target.y,
                size: Math.random() * 2 + 1,
                color: '#e91e63'
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let p of particles) {
                p.tx += (Math.random() - 0.5) * 0.4;
                p.ty += (Math.random() - 0.5) * 0.4;

                let dx = p.tx - p.x;
                let dy = p.ty - p.y;
                p.x += dx * 0.08;
                p.y += dy * 0.08;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            requestAnimationFrame(animate);
        }
        animate();
    }

    initHeartCanvas('heartCanvas1');
    initHeartCanvas('heartCanvas2');

    // Automatic Slideshow Logic for Images
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide-img');
    function nextSlide() {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }
    setInterval(nextSlide, 3500); // Har 3.5 second baad doosri pic automatic aayegi

    // Password Verification
    function checkPassword() {
        let inputVal = document.getElementById('pass-input').value.trim().toLowerCase();
        let cleanInput = inputVal.replace(/\s+/g, ' ').replace(/-/g, '_');
        
        if (cleanInput.includes("6 january") && cleanInput.includes("04:00") && cleanInput.includes("04:35")) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            
            const song = document.getElementById('bg-song');
            song.play().catch(e => console.log("Audio restriction:", e));
        } else {
            document.getElementById('error-msg').innerText = "Oops! Ghalat password hai, dobara try karein.";
        }
    }
</script>

</body>
      </html>
