<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Madina!</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0d0d1a, #2a085c);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.07);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }

        /* 3D Heart with Name Inside */
        .heart-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            perspective: 1000px;
        }
        .heart-3d {
            position: relative;
            width: 60px;
            height: 60px;
            background-color: #ff3366;
            transform: rotate(-45deg);
            animation: pulse3d 1.4s infinite ease-in-out alternate;
            box-shadow: 0 0 30px #ff3366, 0 0 60px #ff3366;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .heart-3d::before,
        .heart-3d::after {
            content: "";
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: #ff3366;
            border-radius: 50%;
            box-shadow: 0 0 20px #ff3366;
        }
        .heart-3d::before {
            top: -30px;
            left: 0;
        }
        .heart-3d::after {
            left: 30px;
            top: 0;
        }
        .heart-text {
            position: absolute;
            transform: rotate(45deg);
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            z-index: 5;
            width: 80px;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        @keyframes pulse3d {
            0% {
                transform: rotate(-45deg) scale(0.85);
            }
            100% {
                transform: rotate(-45deg) scale(1.15);
                box-shadow: 0 0 50px #ff3366, 0 0 90px #ff3366;
            }
        }

        input {
            padding: 12px;
            width: 85%;
            border-radius: 25px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        button {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(45deg, #ff3366, #ff6584);
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            margin-top: 10px;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.6);
        }
        .hidden {
            display: none;
        }
        img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 15px;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            color: #ff6584;
            font-size: 26px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 101, 132, 0.5);
        }
        p {
            font-size: 15px;
            line-height: 1.5;
            color: #e0e0e0;
        }
        .hint-box {
            font-size: 13px;
            color: #ffb6c1;
            background: rgba(255, 101, 132, 0.12);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px dashed rgba(255, 101, 132, 0.4);
        }
    </style>
</head>
<body>

<!-- Password Screen -->
<div class="container" id="login-screen">
    <div class="heart-wrapper">
        <div class="heart-3d">
            <span class="heart-text">Madina</span>
        </div>
    </div>
    
    <h2>🔒 Enter Password</h2>
    <p style="font-size: 13px; color: #aaa; margin-bottom: 12px;">Surprise kholne ke liye password dein</p>
    
    <div class="hint-box">
        💡 <strong>Hint:</strong> 6 January wala special time<br>(Format: 6 January 04:00_04:35)
    </div>

    <input type="password" id="pass-input" placeholder="Password likhein...">
    <br>
    <button onclick="checkPassword()">Unlock Surprise</button>
    <p id="error-msg" style="color: #ff476f; margin-top: 10px; font-size: 14px;"></p>
</div>

<!-- Main Birthday Screen -->
<div class="container hidden" id="main-screen">
    <div class="heart-wrapper">
        <div class="heart-3d">
            <span class="heart-text">Madina</span>
        </div>
    </div>

    <h1>🎉 Happy Birthday Madina! 🎂</h1>
    <p>May your life be filled with endless happiness, beautiful smiles, and success. You are the best friend ever!</p>
    
    <img src="pic1.jpg" alt="Madina Memory 1">
    <img src="pic2.jpg" alt="Madina Memory 2">
    
    <audio id="bg-song" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
    function checkPassword() {
        const inputVal = document.getElementById('pass-input').value.trim();
        const correctPass = "6 January 04:00_04:35";
        
        if (inputVal === correctPass) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            
            const song = document.getElementById('bg-song');
            song.play().catch(e => console.log("Audio autoplay restricted by browser:", e));
        } else {
            document.getElementById('error-msg').innerText = "Oops! Ghalat password hai, dobara try karein.";
        }
    }
</script>

</body>
      </html>
