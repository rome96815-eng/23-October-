<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Madina!</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            color: #4a0e17;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.88);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(194, 24, 91, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            max-width: 400px;
            width: 90%;
            z-index: 10;
            position: absolute;
        }
        .canvas-box {
            position: relative;
            width: 100%;
            height: 180px;
            margin-bottom: 10px;
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
        input {
            padding: 12px;
            width: 85%;
            border-radius: 25px;
            border: 1px solid #f48fb1;
            outline: none;
            text-align: center;
            font-size: 15px;
            margin-bottom: 10px;
            background: #fff;
            color: #333;
        }
        button {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(45deg, #e91e63, #ff4081);
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
            margin-top: 5px;
        }
        button:hover {
            transform: scale(1.05);
        }
        .hidden {
            display: none !important;
        }
        img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 15px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        h2, h1 {
            color: #c2185b;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            line-height: 1.4;
            color: #666;
        }
        .hint-box {
            font-size: 13px;
            color: #ad1457;
            background: rgba(233, 30, 99, 0.08);
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px dashed rgba(233, 30, 99, 0.3);
        }
    </style>
</head>
<body>

<!-- Password Screen -->
<div class="container" id="login-screen">
    <div class="canvas-box">
        <canvas id="heartCanvas1" width="300" height="180"></canvas>
    </div>
    
    <h2>🔒 Enter Password</h2>
    <p style="font-size: 12px; color: #888; margin-bottom: 10px;">Surprise kholne ke liye password dein</p>
    
    <div class="hint-box">
        💡 <strong>Hint:</strong> Special date and time
    </div>

    <input type="password" id="pass-input" placeholder="Password likhein...">
    <br>
    <button onclick="checkPassword()">Unlock Surprise</button>
    <p id="error-msg" style="color: #d32f2f; margin-top: 8px; font-size: 13px;"></p>
</div>

<!-- Main Birthday Screen -->
<div class="container hidden" id="main-screen">
    <div class="canvas-box">
        <canvas id="heartCanvas2" width="300" height="180"></canvas>
    </div>

    <h1>🎉 Happy Birthday Madina! 🎂</h1>
    <p>May your life be filled with endless happiness and smiles. You are the best friend ever!</p>
    
    <img src="pic1.jpg" alt="Madina Memory 1">
    <img src="pic2.jpg" alt="Madina Memory 2">
    
    <audio id="bg-song" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
    function initHeartCanvas(canvasId) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 350;

        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x * 8 + 150, y: y * 8 + 90 };
        }

        for (let i = 0; i < particleCount; i++) {
            let t = Math.random() * Math.PI * 2;
            let target = getHeartPoint(t);
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                tx: target.x,
                ty: target.y,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                size: Math.random() * 2 + 1,
                color: '#e91e63'
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let p of particles) {
                p.tx += (Math.random() - 0.5) * 0.6;
                p.ty += (Math.random() - 0.5) * 0.6;

                let dx = p.tx - p.x;
                let dy = p.ty - p.y;
                p.x += dx * 0.08;
                p.y += dy * 0.08;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            requestAnimationFrame(animate);
        }
        animate();
    }

    initHeartCanvas('heartCanvas1');
    initHeartCanvas('heartCanvas2');

    function checkPassword() {
        const inputVal = document.getElementById('pass-input').value.trim();
        const correctPass = "6 January 04:00_04:35";
        
        if (inputVal === correctPass) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            
            const song = document.getElementById('bg-song');
            song.play().catch(e => console.log("Audio autoplay restricted:", e));
        } else {
            document.getElementById('error-msg').innerText = "Oops! Ghalat password hai, dobara try karein.";
        }
    }
</script>

</body>
      </html>
